<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISPTEC News</title>
    <script>
      // Aplica o tema guardado antes da pintura (evita flash). Claro por defeito.
      (function () {
        try {
          if (localStorage.getItem('isptec_theme') === 'dark')
            document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
