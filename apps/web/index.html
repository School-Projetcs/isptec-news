<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISPTEC News</title>
    <script>
      // Aplica o tema efetivo antes da pintura (evita flash). Default: "sistema"
      // (segue prefers-color-scheme do SO). Manter em sincronia com lib/theme.tsx.
      (function () {
        try {
          var c = localStorage.getItem('isptec_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = c === 'dark' || ((c === 'system' || !c) && systemDark);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
