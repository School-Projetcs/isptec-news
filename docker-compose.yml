services:
  db:
    image: postgres:16-alpine
    container_name: isptec_news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isptec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isptec}
      POSTGRES_DB: ${POSTGRES_DB:-isptec_news}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isptec} -d ${POSTGRES_DB:-isptec_news}"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:latest
    container_name: isptec_news_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
