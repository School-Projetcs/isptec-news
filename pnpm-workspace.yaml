packages:
  - 'apps/*'
  - 'packages/*'

# pnpm ≥ 10 só corre os build scripts (postinstall) das dependências aqui listadas.
# Antes vivia em package.json#pnpm.onlyBuiltDependencies (deprecado no pnpm 10).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - electron
  - esbuild
  - ffmpeg-static
  - ffprobe-static
  - prisma
  - sharp
